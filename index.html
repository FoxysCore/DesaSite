  <style>
    :root {
      /* Основная палитра */
      --color-primary: #7b68ee;
      --color-secondary: #ff6b6b;
      --color-accent: #4ecdc4;
      --color-highlight: #ff9ff3;
      --color-error: #e46969;
      
      /* Фоны */

      --color-border-active: rgba(123, 104, 238, 0.6);

      /* Эффекты и размеры */
      --border-radius: 0.75rem;
      --border-radius-sm: 0.5rem;
      --blur: 12px;
      --shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
      --border-width: 2px;

      /* Размеры панелей */
      --servers-width: 4.5rem; /* 72px */
      --channels-width: 15rem; /* 240px */
      --right-menu-width: 25rem;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: "Segoe UI", system-ui, sans-serif;
    }

    /* Кастомизация скроллбара для всего приложения */
    ::-webkit-scrollbar {
      width: 6px;

    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: var(--color-border-active);
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: var(--color-primary);
    }

    body {
      display: flex;
      height: 100dvh; /* 100dvh решает проблему с панелями навигации в мобильных браузерах */
      background-color: var(--color-bg-main);
      color: var(--color-text);
      overflow: hidden;

    }

    }

  <script type="module"> 
    import { GuildManager } from "./js/guild/GuildManager.js";
    import { Core } from "./js/Core.js";

    const core = new Core();
    //const guildManager = core.getGuildManager();
    //guildManager.createGuild("192.168.1.142:2370").getConnection().connect(false);

    // Обработка сообщений из callback.html
    //{type: AUTH, guildId:123, authMethodName:google, payload:{...}}
    window.addEventListener('message', async (event) => {
      if (event.origin !== window.origin) {return;}
      if (event.data.type != "AUTH") {return;}

      console.log(event.data.guildId);

      core
        .getGuildManager()
        .getGuild(event.data.guildId)
        .getAuthManager()
        .getMethod(event.data.authMethodName)
        .auth(event.data.payload);
    });
  </script>






  <script type="module">
    const serversList = document.querySelector('.servers-list');
    const channelsPanel = document.getElementById('channelsPanel');
    const toggleBtn = document.getElementById('toggleChannelsBtn');
    const messagesArea = document.getElementById('messagesArea');
    const messageInputContainer = document.getElementById('messageInputContainer');
    const messageInput = document.getElementById('messageInput');
    const attachBtn = document.getElementById('attachBtn');
    const sendBtn = document.getElementById('sendBtn');
    const channelList = document.getElementById('channelList');
    const userProfile = document.getElementById('userProfile');
    const closeProfileBtn = document.getElementById('closeProfile');


    messageInput.addEventListener('input', () => {
      attachBtn.classList.toggle('hidden', messageInput.value.trim() !== '');
    });

    sendBtn.addEventListener('click', () => {
      const text = messageInput.value.trim();
      if (text) {
        
        try {
          core.getSelectedGuild().channelManager.getSelectedChannel().processMessage(text);
        } catch (error) {
          console.error("Ошибка при отправке сообщения:", error);
        }

        messageInput.value = '';
        attachBtn.classList.remove('hidden');
        messageInput.style.height = 'auto';
      }
    });

    messageInput.addEventListener('keypress', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        sendBtn.click();
      }
    });

    messageInput.addEventListener('input', () => {
      messageInput.style.height = 'auto';
      messageInput.style.height = Math.min(messageInput.scrollHeight, 100) + 'px';
    });

  </script>
