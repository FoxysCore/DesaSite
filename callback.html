<!-- callback.html -->
<!DOCTYPE html>
<html>
<head>
  <title>Авторизация...</title>
</head>
<body>
  <p>Подождите, идёт авторизация...</p>
  <textarea id="data-input"></textarea>
  <button onclick="tryToSend();">sent</button>
  <script>

    function tryToSend() {
      console.log(window.opener);
      window.opener.postMessage(
        JSON.parse(document.getElementById("data-input").value),
        window.location.origin
      );
    }

    //{type: AUTH, guildId:123, authMethodName:google, payload:{...}}

    const urlParams = new URLSearchParams(window.location.search);
    for (const param of urlParams.keys()) {
      console.log(param, urlParams.get(param));
    }
    const payload = {code: urlParams.get('code')};
    const guildData = JSON.parse(urlParams.get('state'));
    const guildId = guildData.guildId;
    const authMethodName = guildData.methodName;

    const data = {type: "AUTH", guildId: guildId, authMethodName: authMethodName, payload: payload};

    try {
      window.opener.postMessage(
        data,
        window.location.origin
      );
      setTimeout(() => window.close(), 1000);
    } catch (e) {
      console.error(e);
      document.getElementById("data-input").textContent = JSON.stringify(data);
    }
  </script>
</body>
</html>
